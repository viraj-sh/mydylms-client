name: Manual Build

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Build macOS .app"
        type: boolean
        default: false
      build_linux:
        description: "Build Linux standalone"
        type: boolean
        default: false
      build_windows:
        description: "Build Windows standalone + MSIX"
        type: boolean
        default: false
      build_windows_installer:
        description: "Build Windows standalone + Inno Setup installer"
        type: boolean
        default: false
      build_flatpak:
        description: "Build Linux Flatpak"
        type: boolean
        default: false
      version:
        description: "Version to stamp onto this build (e.g. 2.0.1)"
        type: string
        default: "0.0.0"

jobs:
  macos:
    if: ${{ inputs.build_macos }}
    uses: viraj-sh/dev-workflows/.github/workflows/build-macos-app.yml@v1.3.0
    with:
      app_version: ${{ inputs.version }}
      product_name: MYDYLMS
      company_name: viraj-sh
      file_description: "Effortlessly access DY LMS course materials"
      copyright_text: "Copyright © 2025 github.com/viraj-sh"

  linux:
    if: ${{ inputs.build_linux }}
    uses: viraj-sh/dev-workflows/.github/workflows/build-linux-standalone.yml@v1.0.0
    with:
      app_version: ${{ inputs.version }}
      product_name: MYDYLMS
      company_name: viraj-sh
      file_description: "Effortlessly access DY LMS course materials"
      copyright_text: "Copyright © 2025 github.com/viraj-sh"

  windows:
    if: ${{ inputs.build_windows }}
    uses: viraj-sh/dev-workflows/.github/workflows/build-windows-msix.yml@v1.0.0
    with:
      app_version: ${{ inputs.version }}
      product_name: MYDYLMS
      company_name: viraj-sh
      publisher_display_name: viraj-sh
      display_name: "MYDY LMS Client (Unofficial)"
      file_description: "Effortlessly access DY LMS course materials"
      copyright_text: "Copyright © 2025 github.com/viraj-sh"
      executable_name: MYDYLMS
    secrets: inherit

  windows-installer:
    if: ${{ inputs.build_windows_installer }}
    uses: viraj-sh/dev-workflows/.github/workflows/build-windows-installer.yml@v1.1.0
    with:
      app_version: ${{ inputs.version }}
      product_name: MYDYLMS
      company_name: viraj-sh
      file_description: "Effortlessly access DY LMS course materials"
      copyright_text: "Copyright © 2025 github.com/viraj-sh"
      executable_name: MYDYLMS

  flatpak:
    if: ${{ inputs.build_flatpak }}
    uses: viraj-sh/dev-workflows/.github/workflows/build-linux-flatpak.yml@v1.5.0
    with:
      app_version: ${{ inputs.version }}
      product_name: MYDYLMS
      company_name: viraj-sh
      file_description: "Effortlessly access DY LMS course materials"
      copyright_text: "Copyright © 2025 github.com/viraj-sh"
      # Optionally override flatpak‑specific defaults:
      # manifest_path: ".github/flatpak/com.viraj_sh.mydylms.yml"
      # bundle_name: "mydylms.flatpak"
      # artifact_name: "linux-flatpak"